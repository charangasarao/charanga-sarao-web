name: Functions checks

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"
  push:
    branches:
      - "feature/push-notifications-final"
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Firebase configuration JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('firebase.json', 'utf8'))"
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Run notification logic tests
        run: node --test functions/notification-logic.test.js
