name: Functions syntax check

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-check.yml"
  push:
    branches:
      - "feature/push-notifications-final"
    paths:
      - "functions/**"
      - ".github/workflows/functions-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
